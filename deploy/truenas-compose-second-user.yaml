# Second gateway instance, for a different Docmost user.
#
# One container == one Docmost identity. The session store is per-instance, so a
# second user needs their own app, their own volume, their own public hostname
# and their own Cloudflare Access application. Do not point two instances at the
# same volume: they would share one identity and clobber each other's JWT.
#
# Everything below that differs from the first instance is marked CHANGED.
# The network alias in particular MUST be unique -- both containers sit on
# ix-cloudflared-tunnel_default, and a duplicate alias would make the tunnel
# origin ambiguous and route requests to whichever container answers first.

name: docmost-remote-mcp-marilyn            # CHANGED

services:
  docmost-mcp-gateway:
    image: ghcr.io/ickybuck/docmost-mcp-gateway:latest
    restart: unless-stopped
    networks:
      docmost: {}
      tunnel:
        aliases:
          - docmost-mcp-gateway-marilyn     # CHANGED - must be unique
    environment:
      DOCMOST_BASE_URL: http://docmost:3000
      DOCMOST_DISABLE_KEYRING: "1"
    volumes:
      # CHANGED - create this dataset/directory first; must NOT be shared
      - /mnt/apps-ssd/appdata/docmost-mcp-marilyn-data:/data
    cpus: "1.0"
    mem_limit: 1g

networks:
  docmost:
    external: true
    name: ix-knowledge-stack_default
  tunnel:
    external: true
    name: ix-cloudflared-tunnel_default
