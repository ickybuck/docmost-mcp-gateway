# TrueNAS SCALE Custom App (Apps -> Discover -> Custom App -> Install via YAML).
#
# Deliberately publishes NO host port. The MCP endpoint has no authentication of
# its own, so exposing it on 0.0.0.0 would make the whole wiki readable and
# writable by anything on the LAN, bypassing the Cloudflare Access OAuth in front
# of it. Instead the container joins two existing external networks:
#
#   ix-cloudflared-tunnel_default  -> cloudflared reaches http://docmost-mcp-gateway:8000
#   ix-knowledge-stack_default     -> resolves http://docmost:3000
#
# DOCMOST_BASE_URL must match the URL the session was authenticated against. Use
# the in-network name: *.ts.net Tailscale Serve names resolve only via MagicDNS
# and are not resolvable from inside a container on this host.

name: docmost-mcp-gateway

services:
  docmost-mcp-gateway:
    image: ghcr.io/ickybuck/docmost-mcp-gateway:latest
    restart: unless-stopped
    networks:
      docmost: {}
      tunnel:
        aliases:
          - docmost-mcp-gateway
    environment:
      DOCMOST_BASE_URL: http://docmost:3000
      DOCMOST_DISABLE_KEYRING: "1"
    volumes:
      - /mnt/apps-ssd/appdata/docmost-mcp-remote-data:/data
    cpus: "1.0"
    mem_limit: 1g

networks:
  docmost:
    external: true
    name: ix-knowledge-stack_default
  tunnel:
    external: true
    name: ix-cloudflared-tunnel_default
